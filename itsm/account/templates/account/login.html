{% load i18n %}<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% trans "登录" %} - ITSM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f7fa;
        }
        .login-card {
            width: 400px;
            padding: 40px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .login-title {
            text-align: center;
            margin: 0 0 30px;
            font-size: 22px;
            color: #313238;
        }
        .login-field {
            margin-bottom: 20px;
        }
        .login-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #63656e;
        }
        .login-field input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #c4c6cc;
            border-radius: 2px;
            font-size: 14px;
            outline: none;
        }
        .login-field input:focus {
            border-color: #3a84ff;
        }
        .login-error {
            margin: 0 0 16px;
            color: #ea3636;
            font-size: 13px;
        }
        .login-btn {
            width: 100%;
            height: 40px;
            background: #3a84ff;
            color: #fff;
            border: none;
            border-radius: 2px;
            font-size: 14px;
            cursor: pointer;
        }
        .login-btn:hover {
            background: #699df4;
        }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h2 class="login-title">{% trans "ITSM 登录" %}</h2>
        {% if error_message %}
        <p class="login-error">{{ error_message }}</p>
        {% endif %}
        <form method="post" action="/account/login/">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="login-field">
                <label for="id_username">{% trans "用户名" %}</label>
                <input id="id_username" type="text" name="username" autocomplete="username"
                       placeholder="{% trans '请输入用户名' %}" required autofocus>
            </div>
            <div class="login-field">
                <label for="id_password">{% trans "密码" %}</label>
                <input id="id_password" type="password" name="password" autocomplete="current-password"
                       placeholder="{% trans '请输入密码' %}" required>
            </div>
            <button type="submit" class="login-btn">{% trans "登录" %}</button>
        </form>
    </div>
</div>
</body>
</html>
