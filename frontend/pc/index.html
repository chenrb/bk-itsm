<!DOCTYPE html>
<html>
<head>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon"/>
    <meta charset="utf-8">
    <title>{{ PLATFORM_NAME }} | {{ BRAND_NAME }}</title>
    <script>
        // 基础路径 — 开发和生产模式一致
        window.SITE_URL = '/';
        window.STATIC_URL = '/';
        // 后端配置 — 生产模式由 Django 模板引擎替换 {{ }}
        window.VERSION = '{{ VERSION }}';
        window.log_name = '{{ LOG_NAME }}';
        // 用户数据 — 由 Django 模板注入，页面加载时即生效
        // globals.js 中 || 保证开发模式（Vite 不处理模板语法）时回退到默认值
        window.username = '{{ username|escapejs }}';
        window.chname = '{{ chname|escapejs }}';
        window.IS_ITSM_ADMIN = {{ IS_ITSM_ADMIN|default:"0" }};
        // 平台配置 — 由 Django 模板注入
        window.PLATFORM_NAME = '{{ PLATFORM_NAME|escapejs }}';
        window.BRAND_NAME = '{{ BRAND_NAME|escapejs }}';
        window.FAVICON = '{{ FAVICON|escapejs }}';
        window.APP_LOGO = '{{ APP_LOGO|escapejs }}';
        window.FOOTER = '{{ FOOTER|escapejs }}';
    </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
